<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TUNEVIZ · 旋律</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        /* ============ 设计变量 ============ */
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --text: #09090b;
            --text-secondary: #52525b;
            --text-tertiary: #a1a1aa;
            --border: rgba(9, 9, 11, 0.06);
            --border-strong: rgba(9, 9, 11, 0.1);
            --accent-glow-1: rgba(120, 119, 198, 0.12);
            --accent-glow-2: rgba(120, 119, 198, 0.06);
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            font-feature-settings: "ss01", "cv01", "cv11";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 55% at 50% -10%, var(--accent-glow-1), transparent 60%),
                radial-gradient(ellipse 55% 45% at 100% 100%, var(--accent-glow-2), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");
            opacity: 0.025;
            pointer-events: none;
            z-index: 0;
            mix-blend-mode: multiply;
        }

        /* ============ 顶栏 ============ */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            z-index: 1000;
            background: rgba(250, 250, 250, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .topbar-inner {
            max-width: 1120px;
            margin: 0 auto;
            height: 100%;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
            font-size: 0.94rem;
            font-weight: 600;
            letter-spacing: -0.015em;
        }

        .logo-mark {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: linear-gradient(180deg, #18181b 0%, #09090b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 1px 2px rgba(0, 0, 0, 0.15);
        }

        .logo-mark svg {
            width: 14px;
            height: 14px;
        }

        /* ============ 汉堡菜单 ============ */
        .nav-wrap {
            position: relative;
        }

        .menu-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: background 0.2s var(--ease-smooth);
        }

        .menu-btn:hover {
            background: rgba(9, 9, 11, 0.045);
        }

        .menu-btn span {
            display: block;
            width: 15px;
            height: 1.5px;
            background: var(--text);
            border-radius: 2px;
            transition: all 0.32s var(--ease);
            transform-origin: center;
        }

        .menu-btn.active span:nth-child(1) {
            transform: translateY(5.5px) rotate(45deg);
        }

        .menu-btn.active span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0.3);
        }

        .menu-btn.active span:nth-child(3) {
            transform: translateY(-5.5px) rotate(-45deg);
        }

        /* ============ 菜单面板 ============ */
        .menu-panel {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 244px;
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: saturate(180%) blur(24px);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 6px;
            box-shadow:
                0 0 0 0.5px rgba(9, 9, 11, 0.02),
                0 4px 12px rgba(9, 9, 11, 0.05),
                0 16px 40px rgba(9, 9, 11, 0.08);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px) scale(0.98);
            transform-origin: top right;
            transition: opacity 0.24s var(--ease), transform 0.32s var(--ease), visibility 0.24s;
            pointer-events: none;
        }

        .menu-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text);
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: -0.005em;
            transition: background 0.18s var(--ease-smooth);
            cursor: pointer;
        }

        .menu-item:hover {
            background: rgba(9, 9, 11, 0.045);
        }

        .menu-item svg {
            width: 15px;
            height: 15px;
            color: var(--text-tertiary);
            flex-shrink: 0;
            transition: color 0.18s;
        }

        .menu-item:hover svg {
            color: var(--text-secondary);
        }

        /* ============ 主内容 ============ */
        main {
            position: relative;
            z-index: 1;
        }

        /* ============ Hero ============ */
        .hero {
            max-width: 1120px;
            margin: 0 auto;
            padding: 180px 28px 96px;
            text-align: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 12px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 32px;
            box-shadow: 0 1px 2px rgba(9, 9, 11, 0.02);
        }

        .eyebrow-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #18181b;
            box-shadow: 0 0 0 3px rgba(9, 9, 11, 0.08);
            animation: pulse 2.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(9, 9, 11, 0.08); }
            50% { box-shadow: 0 0 0 6px rgba(9, 9, 11, 0.04); }
        }

        .hero h1 {
            font-size: clamp(3.4rem, 9vw, 6.5rem);
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 0.94;
            margin-bottom: 28px;
            background: linear-gradient(180deg, #09090b 0%, #3f3f46 130%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .hero .lead {
            font-size: clamp(1rem, 1.4vw, 1.15rem);
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.75;
            letter-spacing: -0.008em;
            font-weight: 400;
        }

        /* ============ 特性 ============ */
        .features {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 28px 100px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .feature {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 32px 28px;
            position: relative;
            overflow: hidden;
            transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease), border-color 0.3s;
        }

        .feature::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
        }

        .feature:hover {
            transform: translateY(-3px);
            border-color: var(--border-strong);
            box-shadow:
                0 1px 2px rgba(9, 9, 11, 0.03),
                0 12px 32px rgba(9, 9, 11, 0.06);
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: linear-gradient(180deg, #fafafa 0%, #f4f4f5 100%);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transition: transform 0.4s var(--ease);
        }

        .feature:hover .feature-icon {
            transform: scale(1.05) rotate(-2deg);
        }

        .feature-icon svg {
            width: 18px;
            height: 18px;
            color: #18181b;
        }

        .feature h3 {
            font-size: 0.94rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--text);
            margin-bottom: 6px;
        }

        .feature p {
            font-size: 0.84rem;
            color: var(--text-tertiary);
            line-height: 1.6;
            letter-spacing: -0.005em;
        }

        /* ============ 开发者 ============ */
        .dev-section {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 28px 100px;
        }

        .dev-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.4s var(--ease);
        }

        .dev-card:hover {
            border-color: var(--border-strong);
            box-shadow: 0 12px 32px rgba(9, 9, 11, 0.05);
        }

        .dev-card::after {
            content: '';
            position: absolute;
            right: -40px;
            top: 50%;
            transform: translateY(-50%);
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(120, 119, 198, 0.12), transparent 70%);
            pointer-events: none;
        }

        .dev-info {
            position: relative;
            z-index: 1;
        }

        .dev-label {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .dev-name {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .dev-name span {
            color: var(--text-tertiary);
            font-weight: 400;
            font-size: 0.9rem;
            margin-left: 6px;
        }

        .dev-meta {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            font-variant-numeric: tabular-nums;
        }

        .dev-meta-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #18181b;
        }

        /* ============ CTA ============ */
        .cta-section {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 28px 120px;
            text-align: center;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 26px;
            background: linear-gradient(180deg, #18181b 0%, #09090b 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 500;
            letter-spacing: -0.005em;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), background 0.3s;
            box-shadow:
                0 1px 2px rgba(9, 9, 11, 0.15),
                0 4px 12px rgba(9, 9, 11, 0.12),
                0 12px 32px rgba(9, 9, 11, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.14),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-1.5px);
            box-shadow:
                0 2px 4px rgba(9, 9, 11, 0.15),
                0 8px 24px rgba(9, 9, 11, 0.18),
                0 20px 48px rgba(9, 9, 11, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow:
                0 1px 2px rgba(9, 9, 11, 0.15),
                0 2px 6px rgba(9, 9, 11, 0.12),
                inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .btn-primary .arrow {
            display: inline-flex;
            transition: transform 0.32s var(--ease);
        }

        .btn-primary:hover .arrow {
            transform: translateX(3px);
        }

        /* ============ 页脚 ============ */
        footer {
            position: relative;
            z-index: 1;
            border-top: 1px solid var(--border);
            padding: 32px 28px;
            text-align: center;
        }

        .footer-inner {
            max-width: 1120px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            font-size: 0.76rem;
            color: var(--text-tertiary);
            letter-spacing: 0.01em;
        }

        .footer-inner span:first-child {
            font-weight: 500;
        }

        /* ============ 滚动入场动画 ============ */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
            will-change: opacity, transform;
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal[data-delay="1"] { transition-delay: 0.06s; }
        .reveal[data-delay="2"] { transition-delay: 0.12s; }
        .reveal[data-delay="3"] { transition-delay: 0.18s; }

        /* ============ 响应式 ============ */
        @media (max-width: 900px) {
            .features {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .feature {
                padding: 26px 24px;
            }

            .dev-card {
                padding: 24px 28px;
            }
        }

        @media (max-width: 640px) {
            .topbar-inner {
                padding: 0 20px;
            }

            .hero {
                padding: 140px 20px 72px;
            }

            .eyebrow {
                margin-bottom: 24px;
                font-size: 0.68rem;
                padding: 5px 12px 5px 10px;
            }

            .hero h1 {
                margin-bottom: 22px;
            }

            .features {
                padding: 0 20px 72px;
            }

            .dev-section {
                padding: 0 20px 72px;
            }

            .dev-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                padding: 22px 24px;
            }

            .cta-section {
                padding: 0 20px 88px;
            }

            .btn-primary {
                width: 100%;
                justify-content: center;
                padding: 16px 24px;
            }

            .menu-panel {
                right: -8px;
                width: 232px;
            }

            .footer-inner {
                flex-direction: column;
                gap: 6px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }

            .reveal {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>

        <!-- 特性 -->
        <section class="features">
            <article class="feature reveal">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12h2l2-7 4 14 3-9 2 5h5"/>
                    </svg>
                </div>
                <h3>高保真音质</h3>

            <article class="feature reveal" data-delay="2">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">

                    </svg>

        <!-- 开发者 -->
        <section class="dev-section">
            <div class="dev-card reveal">
                <div class="dev-info">

                    <span class="dev-meta-dot"></span>

                </div>

        </section>

        <!-- CTA -->
        <section class="cta-section">
            <a class="btn-primary reveal" href="https://tuneviz.github.io/HOME" target="_blank" rel="noopener noreferrer">
                选择播放器
                <span class="arrow">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"/>
                        <path d="m12 5 7 7-7 7"/>
                    </svg>
                </span>
            </a>
        </section>
    </main>

    <!-- ===== 页脚 ===== -->
    <footer>
        <div class="footer-inner">
            <span>© TUNEVIZ · 旋律</span>
            <span>Designed for pure listening.</span>
        </div>
    </footer>

    <script>
        (function () {
            /* ========== 菜单开关 ========== */
            const menuBtn = document.getElementById('menuBtn');
            const menuPanel = document.getElementById('menuPanel');
            const menuItems = document.querySelectorAll('.menu-item');

            function toggleMenu() {
                const isOpen = menuPanel.classList.contains('open');
                menuPanel.classList.toggle('open');
                menuBtn.classList.toggle('active');
                menuBtn.setAttribute('aria-expanded', String(!isOpen));
            }

            function closeMenu() {
                menuPanel.classList.remove('open');
                menuBtn.classList.remove('active');
                menuBtn.setAttribute('aria-expanded', 'false');
            }

            menuBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                toggleMenu();
            });

            menuItems.forEach(function (item) {
                item.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const url = this.dataset.url;
                    closeMenu();
                    if (url) {
                        window.open(url, '_blank', 'noopener,noreferrer');
                    }
                });
            });

            document.addEventListener('click', function (e) {
                if (!menuPanel.contains(e.target) && !menuBtn.contains(e.target)) {
                    closeMenu();
                }
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeMenu();
            });

            /* ========== 滚动入场 ========== */
            const reveals = document.querySelectorAll('.reveal');

            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, {
                    threshold: 0.12,
                    rootMargin: '0px 0px -40px 0px'
                });

                reveals.forEach(function (el) {
                    observer.observe(el);
                });
            } else {
                reveals.forEach(function (el) {
                    el.classList.add('visible');
                });
            }
        })();
    </script>

</body>
</html>
